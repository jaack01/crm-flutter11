name: laundry_crm
description: A production-grade CRM application for laundry shops with customer management, order tracking, billing, and analytics.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Database
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0+4  # For Windows support
  path: ^1.8.3
  path_provider: ^2.1.1

  # Dependency Injection
  get_it: ^7.6.4
  injectable: ^2.3.2

  # Navigation
  go_router: ^12.1.1

  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^9.1.0

  # PDF Generation & Printing
  pdf: ^3.10.7
  printing: ^5.11.1

  # Excel Export
  excel: ^4.0.2

  # QR Code & Barcode
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  mobile_scanner: ^3.5.2

  # Date & Time
  intl: ^0.18.1

  # Image Handling
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0

  # Local Notifications
  flutter_local_notifications: ^16.2.0

  # Local Storage
  shared_preferences: ^2.2.2

  # File Handling
  open_file: ^3.3.2
  file_picker: ^6.1.1

  # Charts & Graphs
  fl_chart: ^0.65.0

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0

  # Utilities
  logger: ^2.0.2+1
  dartz: ^0.10.1
  uuid: ^4.2.1

  # Permissions
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1

  # Linting
  flutter_lints: ^3.0.1

  # Testing
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
